[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klin-worker"
version = "0.2.0"
description = "AI File Organizer — local FastAPI backend for semantic file analysis and classification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "docling>=2.31.0",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.135.1",
    "greenlet>=3.3.2",
    "httpx>=0.28.0",
    "numpy>=2.4.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "raganything[all]>=1.2.9",
    "sqlmodel>=0.0.37",
    "uvicorn>=0.41.0",
    "fastapi-voyager>=0.18.0",
]

[project.scripts]
klin-worker = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "models*", "docs*", "klin-bruno-api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests requiring live llama-server dependencies",
]

[tool.ruff]
target-version = "py313"
line-length = 100


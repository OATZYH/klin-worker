name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check version consistency
        run: uv run python scripts/check_version_sync.py

      - name: Ruff (syntax and undefined-name checks)
        run: uv run ruff check app tests scripts main.py --select E9,F63,F7,F82

      - name: Ruff format check (tests and scripts)
        run: uv run ruff format --check tests scripts

      - name: Run non-LLM tests
        run: uv run pytest -q -m "not llm"
